name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: heart3d/package-lock.json

      - name: Check API URL
        env:
          CARDIOSCOPE_API_URL: ${{ vars.CARDIOSCOPE_API_URL }}
        run: |
          if [ -z "$CARDIOSCOPE_API_URL" ]; then
            echo "::error::Set the repository variable CARDIOSCOPE_API_URL to your Render service URL."
            exit 1
          fi
          node -e 'const url = new URL(process.env.CARDIOSCOPE_API_URL); if (url.protocol !== "https:" || url.pathname !== "/" || url.search || url.hash) { console.error("CARDIOSCOPE_API_URL must be an HTTPS origin, for example https://cardioscope-api.onrender.com"); process.exit(1); }'

      - name: Install viewer dependencies
        working-directory: heart3d
        run: npm ci

      - name: Test viewer logic
        working-directory: heart3d
        run: npm run test:lib

      - name: Build viewer
        working-directory: heart3d
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages site
        env:
          CARDIOSCOPE_API_URL: ${{ vars.CARDIOSCOPE_API_URL }}
        run: |
          mkdir -p _site/heart3d
          cp index.html config.js _site/
          cp -R heart3d/dist/. _site/heart3d/
          touch _site/.nojekyll
          node -e 'const fs = require("node:fs"); const url = process.env.CARDIOSCOPE_API_URL.replace(/\/+$/, ""); fs.writeFileSync("_site/config.js", `window.CARDIOSCOPE_API_BASE_URL = ${JSON.stringify(url)};\n`);'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
